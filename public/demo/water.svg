<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#f9fafb" />
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="150" fill="#0369a1" />
  <text x="750" y="80" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="end" direction="rtl">فاتورة المياه والصرف الصحي</text>
  <text x="750" y="120" font-family="Arial, sans-serif" font-size="20" fill="#e0f2fe" text-anchor="end" direction="rtl">نموذج تجريبي DEMO / SAMPLE - لا يحتوي على بيانات حقيقية</text>

  <!-- Account Details -->
  <rect x="50" y="200" width="700" height="180" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" />
  <text x="720" y="240" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#111827" text-anchor="end" direction="rtl">تفاصيل الحساب</text>
  
  <text x="720" y="280" font-family="Arial, sans-serif" font-size="18" fill="#6b7280" text-anchor="end" direction="rtl">رقم الحساب:</text>
  <text x="600" y="280" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111827" text-anchor="end" direction="rtl">500600700800</text>
  
  <text x="720" y="315" font-family="Arial, sans-serif" font-size="18" fill="#6b7280" text-anchor="end" direction="rtl">رقم العداد:</text>
  <text x="600" y="315" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111827" text-anchor="end" direction="rtl">99012345</text>

  <text x="720" y="350" font-family="Arial, sans-serif" font-size="18" fill="#6b7280" text-anchor="end" direction="rtl">فترة الاستهلاك:</text>
  <text x="600" y="350" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111827" text-anchor="end" direction="rtl">1 يوليو — 30 يوليو</text>

  <!-- Consumption Details -->
  <rect x="50" y="420" width="700" height="250" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" />
  <text x="720" y="460" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#111827" text-anchor="end" direction="rtl">تفاصيل الاستهلاك</text>

  <text x="720" y="520" font-family="Arial, sans-serif" font-size="18" fill="#6b7280" text-anchor="end" direction="rtl">القراءة السابقة:</text>
  <text x="580" y="520" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111827" text-anchor="end" direction="rtl">1,200</text>

  <text x="720" y="560" font-family="Arial, sans-serif" font-size="18" fill="#6b7280" text-anchor="end" direction="rtl">القراءة الحالية:</text>
  <text x="580" y="560" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111827" text-anchor="end" direction="rtl">1,235</text>
  
  <line x1="100" y1="590" x2="700" y2="590" stroke="#e5e7eb" stroke-width="2" />

  <text x="720" y="630" font-family="Arial, sans-serif" font-size="22" fill="#111827" font-weight="bold" text-anchor="end" direction="rtl">كمية الاستهلاك (مترمكعب):</text>
  <text x="450" y="630" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#0369a1" text-anchor="end" direction="rtl">35</text>

  <!-- Total Amount -->
  <rect x="50" y="710" width="700" height="180" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="2" />
  <text x="720" y="760" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#075985" text-anchor="end" direction="rtl">المبلغ المطلوب سداده</text>
  <text x="720" y="830" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#0369a1" text-anchor="end" direction="rtl">180.00</text>
  <text x="520" y="830" font-family="Arial, sans-serif" font-size="24" fill="#075985" text-anchor="end" direction="rtl">ريال سعودي</text>

</svg>
